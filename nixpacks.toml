[phases.setup]
nixPkgs = ["php82", "php82Extensions.mbstring", "php82Extensions.xml", "php82Extensions.tokenizer", "php82Extensions.pdo", "php82Extensions.pdo_mysql", "php82Extensions.mysql", "php82Extensions.curl", "php82Extensions.fileinfo", "php82Extensions.gd", "php82Extensions.zip", "php82Extensions.bcmath", "php82Extensions.ctype", "php82Extensions.openssl", "composer"]

[phases.install]
cmds = ["composer install --no-dev --optimize-autoloader --no-interaction"]

[start]
cmd = "php artisan migrate --force && php artisan db:seed --class=DatabaseSeeder --force && php artisan storage:link --force && cd public && php -S 0.0.0.0:$PORT -d upload_max_filesize=110M -d post_max_size=120M -d memory_limit=256M ../vendor/laravel/framework/src/Illuminate/Foundation/resources/server.php"
